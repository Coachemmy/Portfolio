  /* Mobile: 1 column */
  .portfolio-grid-container {
    display: grid;
    grid-template-columns: 1fr;

  }

  @media (min-width: 768px) {
    .portfolio-grid-container {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  /* Desktop: 3 columns */

    .portfolio-grid-container {
      grid-template-columns: repeat(3, 1fr);
    }
  }
